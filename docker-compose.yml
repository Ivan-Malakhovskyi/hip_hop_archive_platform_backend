version: '3.9'

services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    # env_file:
    #   - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kMltbOEZsRrMGrNCzuvWzfmaQOVgkvVa
      POSTGRES_DB: railway
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    restart: always

  api:
    container_name: api
    build:
      context: .
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - 5000:5000
      - 9229:9229
    command: npm run start:dev
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

